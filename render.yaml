services:
  - type: web
    name: elaine-jeferson-galeria
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: elaine
      - key: MAX_IMAGE_MB
        value: "15"
      - key: MAX_VIDEO_MB
        value: "80"
