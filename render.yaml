services:
  - type: web
    name: elaine-jeferson-galeria
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    repo: https://github.com/JefersonElaine/E-J
    branch: main
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elaine-jeferson-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: local
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        fromService:
          name: elaine-jeferson-galeria
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: gallery-data
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: elaine-jeferson-db
    plan: 0.1c-256mb
    databaseName: galeria
    user: galeria
    postgresMajorVersion: "16"
    ipAllowList: []
