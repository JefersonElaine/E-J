<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code — Elaine &amp; Jeferson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    @page { size: A6; margin: 12mm; }
    body {
      margin: 0;
      background: #f7f3ec;
      color: #161616;
      font-family: "Cormorant Garamond", serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 360px;
      text-align: center;
      padding: 28px 22px 24px;
      border: 1px solid #d7d1c7;
      background: #fffcf7;
    }
    .kicker { letter-spacing: 0.28em; text-transform: uppercase; font-size: 11px; color: #6a655e; }
    h1 { font-family: "Great Vibes", cursive; font-size: 42px; font-weight: 400; margin: 8px 0 6px; }
    img { width: 260px; height: 260px; margin: 8px auto; display: block; }
    p { margin: 8px 0 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    .date { letter-spacing: 0.28em; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Compartilhe conosco</p>
    <h1>Elaine &amp; Jeferson</h1>
    <p class="date">27.11.2026</p>
    <img src="/qr-casamento.png" alt="QR Code da galeria" />
    <p>Aponte a camera e envie sua foto</p>
  </div>
</body>
</html>
